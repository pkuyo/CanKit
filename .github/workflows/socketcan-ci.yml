name: CI-adapter-socketcan

on:
  push:
    paths:
      - '.github/workflows/socketcan-ci.yml'
      - 'src/core/CanKit.Core/**'
      - 'src/adapters/CanKit.Adapter.SocketCAN/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'global.json'
      - 'samples/CanKit.Sample.Sniffer/**'
      - 'samples/CanKit.Sample.QuickStartTxRx/**'
  pull_request:
    paths:
      - '.github/workflows/socketcan-ci.yml'
      - 'src/core/CanKit.Core/**'
      - 'src/adapters/CanKit.Adapter.SocketCAN/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'global.json'
      - 'samples/CanKit.Sample.Sniffer/**'
      - 'samples/CanKit.Sample.QuickStartTxRx/**'
jobs:
  linux:
    name: SocketCAN (Ubuntu) – ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
      
      - name: Configure endpoints
        run: |
          set -e
          echo "CANKIT_TEST_ADAPTERS=CanKit.Adapter.SocketCAN" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore CanKitAdapters.slnf

      - name: Test (${{ matrix.tfm }})
        run: dotnet test CanKitAdapters.slnf -c Fake -f ${{ matrix.tfm }} --logger "trx;LogFileName=TestResults-${{ matrix.tfm }}.trx"

      - name: Upload Test Results (${{ matrix.tfm }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-${{ matrix.tfm }}
          path: '**/TestResults-${{ matrix.tfm }}.trx'

  linux-arm32:
    name: SocketCAN (Linux ARM32)
    runs-on: ubuntu-22.04
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Configure vcan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          for iface in vcan0 vcan1 vcan2; do
            sudo ip link add dev "$iface" type vcan
            sudo ip link set up "$iface"
          done

      - name: Test SocketCAN and publish affected samples on ARM32
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            --network host \
            -e CANKIT_TEST_ADAPTERS=CanKit.Adapter.SocketCAN \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            mcr.microsoft.com/dotnet/sdk:8.0-jammy-arm32v7 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends libsocketcan-dev
              dotnet test CanKitAdapters.slnf \
                -c Release -f net8.0 \
                --logger "trx;LogFileName=Arm32TestResults.trx"
              dotnet publish samples/CanKit.Sample.Sniffer/CanKit.Sample.Sniffer.csproj \
                -c Release -f net8.0 -r linux-arm --self-contained false \
                -o .artifacts/sniffer-linux-arm
              dotnet publish samples/CanKit.Sample.QuickStartTxRx/CanKit.Sample.QuickStartTxRx.csproj \
                -c Release -f net8.0 -r linux-arm --self-contained false \
                -o .artifacts/quickstart-linux-arm
            '

      - name: Upload ARM32 test results and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socketcan-linux-arm32
          path: |
            '**/Arm32TestResults.trx'
            .artifacts/
