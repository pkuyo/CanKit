name: CI-adapter-socketcan

on:
  push:
    paths:
      - '.github/workflows/socketcan-ci.yml'
      - 'src/core/CanKit.Core/**'
      - 'src/adapters/CanKit.Adapter.SocketCAN/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'global.json'
      - 'samples/CanKit.Sample.Sniffer/**'
      - 'samples/CanKit.Sample.QuickStartTxRx/**'
  pull_request:
    paths:
      - '.github/workflows/socketcan-ci.yml'
      - 'src/core/CanKit.Core/**'
      - 'src/adapters/CanKit.Adapter.SocketCAN/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'global.json'
      - 'samples/CanKit.Sample.Sniffer/**'
      - 'samples/CanKit.Sample.QuickStartTxRx/**'
jobs:
  linux:
    name: SocketCAN (Ubuntu x64, vcan) – ${{ matrix.tfm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CANKIT_TEST_ADAPTERS: CanKit.Adapter.SocketCAN
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure real SocketCAN vcan topology
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -m)" = "x86_64"
          test "$(getconf LONG_BIT)" = "64"

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends can-utils libsocketcan-dev

          if ! sudo modprobe vcan || ! sudo modprobe can-gw; then
            sudo apt-get install --yes --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
            sudo modprobe can-gw
          fi

          for iface in vcan0 vcan1 vcan2; do
            sudo ip link add dev "$iface" type vcan
            sudo ip link set dev "$iface" mtu 72
            sudo ip link set dev "$iface" up
            ip -details link show "$iface" | grep -qw vcan
          done

          for route in "vcan0 vcan1" "vcan1 vcan0"; do
            read -r source destination <<< "$route"
            sudo cangw -A -s "$source" -d "$destination" -e -l 1
            sudo cangw -A -s "$source" -d "$destination" -e -X -l 1
          done

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
      
      - name: Restore
        run: dotnet restore CanKitAdapters.slnf

      - name: Test real SocketCAN (${{ matrix.tfm }})
        run: dotnet test CanKitAdapters.slnf -c Release -f ${{ matrix.tfm }} --no-restore --logger "trx;LogFileName=TestResults-${{ matrix.tfm }}.trx"

      - name: Upload Test Results (${{ matrix.tfm }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socketcan-ubuntu-x64-vcan-${{ matrix.tfm }}
          path: '**/TestResults-${{ matrix.tfm }}.trx'

  linux-arm32-pr:
    name: SocketCAN (Linux ARM32, PR)
    if: github.event_name == 'pull_request'
    environment: arm32-runner
    runs-on: [self-hosted, linux, ARM, arm32, raspberry-pi]
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CANKIT_TEST_ADAPTERS: CanKit.Adapter.SocketCAN
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify ARM32 runner and vcan
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "armv7l"
          test "$(getconf LONG_BIT)" = "32"
          test "$(dpkg --print-architecture)" = "armhf"
          for iface in vcan0 vcan1 vcan2; do
            ip link show "$iface" > /dev/null
            ip -details link show "$iface" | grep -qw vcan
          done

      - name: Configure writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CanKitAdapters.slnf

      - name: Test SocketCAN on ARM32
        run: dotnet test CanKitAdapters.slnf -c Release -f net8.0 --no-restore --logger "trx;LogFileName=Arm32TestResults.trx"

      - name: Publish affected samples for ARM32
        run: |
          dotnet publish samples/CanKit.Sample.Sniffer/CanKit.Sample.Sniffer.csproj \
            -c Release -f net8.0 -r linux-arm --self-contained false \
            -o .artifacts/sniffer-linux-arm
          dotnet publish samples/CanKit.Sample.QuickStartTxRx/CanKit.Sample.QuickStartTxRx.csproj \
            -c Release -f net8.0 -r linux-arm --self-contained false \
            -o .artifacts/quickstart-linux-arm

      - name: Upload ARM32 test results and samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socketcan-linux-arm32-pr
          path: |
            '**/Arm32TestResults.trx'
            .artifacts/

  linux-arm32-push:
    name: SocketCAN (Linux ARM32, push)
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, ARM, arm32, raspberry-pi]
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CANKIT_TEST_ADAPTERS: CanKit.Adapter.SocketCAN
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify ARM32 runner and vcan
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "armv7l"
          test "$(getconf LONG_BIT)" = "32"
          test "$(dpkg --print-architecture)" = "armhf"
          for iface in vcan0 vcan1 vcan2; do
            ip link show "$iface" > /dev/null
            ip -details link show "$iface" | grep -qw vcan
          done

      - name: Configure writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CanKitAdapters.slnf

      - name: Test SocketCAN on ARM32
        run: dotnet test CanKitAdapters.slnf -c Release -f net8.0 --no-restore --logger "trx;LogFileName=Arm32TestResults.trx"

      - name: Publish affected samples for ARM32
        run: |
          dotnet publish samples/CanKit.Sample.Sniffer/CanKit.Sample.Sniffer.csproj \
            -c Release -f net8.0 -r linux-arm --self-contained false \
            -o .artifacts/sniffer-linux-arm
          dotnet publish samples/CanKit.Sample.QuickStartTxRx/CanKit.Sample.QuickStartTxRx.csproj \
            -c Release -f net8.0 -r linux-arm --self-contained false \
            -o .artifacts/quickstart-linux-arm

      - name: Upload ARM32 test results and samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socketcan-linux-arm32-push
          path: |
            '**/Arm32TestResults.trx'
            .artifacts/
