name: CI-coverage

on:
  push:
    paths:
      - 'src/**'
      - 'tests/CanKit.Tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/CanKit.Tests/**'

jobs:
  coverage:
    name: Code coverage (Ubuntu, net8.0)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure endpoints
        run: |
          set -e
          echo "CANKIT_TEST_ADAPTERS=CanKit.Adapter.Virtual" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore CanKit.sln

      - name: Test with coverage
        run: >
          dotnet test tests/CanKit.Tests/CanKit.Tests.csproj -c Release -f net8.0
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/**/*.cobertura.xml
