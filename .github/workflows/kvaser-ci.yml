name: CI-adapter-kvaser

on:
  push:
    paths:
      - 'src/core/CanKit.Core/**'
      - 'src/adapters/CanKit.Adapter.Kvaser/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'global.json'
  pull_request:
    paths:
      - 'src/core/CanKit.Core/**'
      - 'src/adapters/CanKit.Adapter.Kvaser/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'global.json'
jobs:
  windows:
    name: Kvaser (windows) – ${{ matrix.tfm }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0, net48]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json

      - name: Configure endpoints
        shell: pwsh
        run: |
          "CANKIT_TEST_ADAPTERS=CanKit.Adapter.Kvaser" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore CanKitAdapters.slnf

      - name: Test (${{ matrix.tfm }})
        run: dotnet test --solution CanKitAdapters.slnf -c Fake -f ${{ matrix.tfm }} --report-trx --report-trx-filename TestResults-${{ matrix.tfm }}.trx

      - name: Upload Test Results (${{ matrix.tfm }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-${{ matrix.tfm }}
          path: '**/TestResults-${{ matrix.tfm }}.trx'

  linux:
    name: Kvaser (Ubuntu) – ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
      
      - name: Configure endpoints
        run: |
          set -e
          echo "CANKIT_TEST_ADAPTERS=CanKit.Adapter.Kvaser" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore CanKitAdapters.slnf

      - name: Test (${{ matrix.tfm }})
        run: dotnet test --solution CanKitAdapters.slnf -c Fake -f ${{ matrix.tfm }} --report-trx --report-trx-filename TestResults-${{ matrix.tfm }}.trx

      - name: Upload Test Results (${{ matrix.tfm }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-${{ matrix.tfm }}
          path: '**/TestResults-${{ matrix.tfm }}.trx'

