name: CI-addressing

on:
  push:
    paths:
      - 'src/core/CanKit.Pro.Addressing/**'
      - 'src/core/CanKit.Abstractions/**'
      - 'src/core/CanKit.Core/**'
      - 'src/core/CanKit.Pro.RawCan/**'
      - 'src/adapters/CanKit.Adapter.Virtual/**'
      - 'tests/CanKit.Tests/**'
  pull_request:
    paths:
      - 'src/core/CanKit.Pro.Addressing/**'
      - 'src/core/CanKit.Abstractions/**'
      - 'src/core/CanKit.Core/**'
      - 'src/core/CanKit.Pro.RawCan/**'
      - 'src/adapters/CanKit.Adapter.Virtual/**'
      - 'tests/CanKit.Tests/**'
jobs:
  windows:
    name: Addressing (windows) – ${{ matrix.tfm }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net48]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure endpoints
        shell: pwsh
        run: |
          "CANKIT_TEST_ADAPTERS=CanKit.Adapter.Virtual" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore CanKitAddressing.slnf

      - name: Test (${{ matrix.tfm }})
        run: dotnet test CanKitAddressing.slnf -c Release -f ${{ matrix.tfm }} --filter "FullyQualifiedName~Addressing|FullyQualifiedName~CanIdFilter|FullyQualifiedName~J1939Id|FullyQualifiedName~J1939Name" --logger "trx;LogFileName=TestResults-${{ matrix.tfm }}.trx"

      - name: Upload Test Results (${{ matrix.tfm }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-${{ matrix.tfm }}
          path: '**/TestResults-${{ matrix.tfm }}.trx'

  linux:
    name: Addressing (Ubuntu)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure endpoints
        run: |
          set -e
          echo "CANKIT_TEST_ADAPTERS=CanKit.Adapter.Virtual" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore CanKitAddressing.slnf

      - name: Test (net8.0)
        run: dotnet test CanKitAddressing.slnf -c Release -f net8.0 --filter "FullyQualifiedName~Addressing|FullyQualifiedName~CanIdFilter|FullyQualifiedName~J1939Id|FullyQualifiedName~J1939Name" --logger "trx;LogFileName=TestResults.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu
          path: '**/TestResults.trx'
