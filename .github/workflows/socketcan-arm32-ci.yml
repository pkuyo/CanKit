name: CI-adapter-socketcan-arm32
run-name: >-
  ${{ github.event_name == 'pull_request_target'
      && format('ARM32 PR #{0}', github.event.number)
      || format('ARM32 {0} - {1}', github.event_name == 'workflow_dispatch' && 'manual' || 'push', github.ref_name) }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - fix-arm32-tailscale-ci
    paths:
      - '.github/workflows/socketcan-arm32-ci.yml'
      - 'eng/CanKit.Arm32Ci/**'
      - 'src/core/**'
      - 'src/adapters/CanKit.Adapter.SocketCAN/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'eng/package-versions.props'
      - 'global.json'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/socketcan-arm32-ci.yml'
      - 'eng/CanKit.Arm32Ci/**'
      - 'src/core/**'
      - 'src/adapters/CanKit.Adapter.SocketCAN/**'
      - 'tests/CanKit.Tests/**'
      - 'src/Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'eng/package-versions.props'
      - 'global.json'

jobs:
  linux-arm32-pr:
    name: SocketCAN (Linux ARM32, ${{ github.event_name == 'pull_request_target' && 'PR' || github.event_name == 'workflow_dispatch' && 'manual' || 'branch' }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/fix-arm32-tailscale-ci')
    environment: arm32-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cankit-socketcan-arm32
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout test commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .arm32-source
          persist-credentials: false

      - name: Setup .NET for the controller
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build ARM32 CI tool
        run: dotnet publish eng/CanKit.Arm32Ci/CanKit.Arm32Ci.csproj -c Release -o artifacts/arm32-ci

      - name: Check ARM32 connection settings
        shell: bash
        env:
          ARM32_HOST: ${{ vars.ARM32_HOST }}
          TS_ARM32_CLIENT_ID: ${{ vars.TS_ARM32_CLIENT_ID }}
          TS_ARM32_AUDIENCE: ${{ vars.TS_ARM32_AUDIENCE }}
        run: |
          for setting in ARM32_HOST TS_ARM32_CLIENT_ID TS_ARM32_AUDIENCE; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Set the repository variable $setting."
              exit 1
            fi
          done

      - name: Connect to ARM32 test network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_ARM32_CLIENT_ID }}
          audience: ${{ vars.TS_ARM32_AUDIENCE }}
          tags: tag:cankit-ci
          ping: ${{ vars.ARM32_HOST }}

      - name: Test SocketCAN on ARM32
        shell: bash
        env:
          ARM32_HOST: ${{ vars.ARM32_HOST }}
          ARM32_USER: ${{ vars.ARM32_USER || 'actions-runner' }}
          ARM32_SOURCE_DIRECTORY: .arm32-source
        run: exec dotnet artifacts/arm32-ci/CanKit.Arm32Ci.dll controller

      - name: Upload ARM32 test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socketcan-linux-arm32-pr
          path: TestResults/arm32/

  linux-arm32-push:
    name: SocketCAN (Linux ARM32, push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cankit-socketcan-arm32
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET for the controller
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build ARM32 CI tool
        run: dotnet publish eng/CanKit.Arm32Ci/CanKit.Arm32Ci.csproj -c Release -o artifacts/arm32-ci

      - name: Check ARM32 connection settings
        shell: bash
        env:
          ARM32_HOST: ${{ vars.ARM32_HOST }}
          TS_ARM32_CLIENT_ID: ${{ vars.TS_ARM32_CLIENT_ID }}
          TS_ARM32_AUDIENCE: ${{ vars.TS_ARM32_AUDIENCE }}
        run: |
          for setting in ARM32_HOST TS_ARM32_CLIENT_ID TS_ARM32_AUDIENCE; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Set the repository variable $setting."
              exit 1
            fi
          done

      - name: Connect to ARM32 test network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_ARM32_CLIENT_ID }}
          audience: ${{ vars.TS_ARM32_AUDIENCE }}
          tags: tag:cankit-ci
          ping: ${{ vars.ARM32_HOST }}

      - name: Test SocketCAN on ARM32
        shell: bash
        env:
          ARM32_HOST: ${{ vars.ARM32_HOST }}
          ARM32_USER: ${{ vars.ARM32_USER || 'actions-runner' }}
        run: exec dotnet artifacts/arm32-ci/CanKit.Arm32Ci.dll controller

      - name: Upload ARM32 test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: socketcan-linux-arm32-push
          path: TestResults/arm32/
